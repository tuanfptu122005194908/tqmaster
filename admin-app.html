<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f4f7fc" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TQMaster Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #f4f7fc; }
      /* instant branded pre-loader, replaced as soon as React mounts */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(900px 420px at 15% -10%, rgba(59,130,246,.28), transparent 60%), #f4f7fc; font-family: Inter, sans-serif; }
      #boot img { width: 112px; height: 112px; }
      #boot b { margin-top: 14px; font-size: 24px; font-weight: 900; letter-spacing: -0.03em; color: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/tqmaster-logo.svg" alt="" /><b>TQMaster Admin</b></div></div>
    <script type="module" src="/src/app-admin/main.tsx"></script>
  </body>
</html>
